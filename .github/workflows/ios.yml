name: iOS technical milestone
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-and-package:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          brew install xcodegen
          xcodegen --version
      - name: Generate Xcode project
        run: |
          xcodegen generate
          git diff --exit-code -- Bloom/Info.plist
      - name: Test persistence and recovery
        shell: bash
        run: |
          set -euo pipefail
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys,re; d=json.load(sys.stdin); keys=sorted((k for k in d["devices"] if "iOS" in k), key=lambda k: tuple(map(int,re.findall(r"\d+",k))), reverse=True); print(next(x["udid"] for key in keys for x in d["devices"][key] if x["name"].startswith("iPhone")))')
          xcodebuild -project Bloom.xcodeproj -scheme Bloom -destination "platform=iOS Simulator,id=$DEVICE_ID" -only-testing:BloomUITests/DailyUseUITests/testMapListsSavedPlaceAndOpensItsNote -only-testing:BloomUITests/DailyUseUITests/testBulkArchiveAndRestore -resultBundlePath build/NavigationPreflight.xcresult CODE_SIGNING_ALLOWED=NO test 2>&1 | tee build-xcodebuild.log
          xcodebuild -project Bloom.xcodeproj -scheme Bloom -destination "platform=iOS Simulator,id=$DEVICE_ID" -resultBundlePath build/Tests.xcresult CODE_SIGNING_ALLOWED=NO test 2>&1 | tee build-xcodebuild.log
      - name: Build diagnostics summary
        if: always()
        shell: bash
        run: |
          python3 - <<'PYREPORT'
          import os
          from pathlib import Path
          log = Path('build-xcodebuild.log')
          if log.exists():
              lines = log.read_text(errors='replace').splitlines()
              selected = [line for line in lines if any(word in line for word in ['error:', 'failed', 'Testing failed', 'Executed '])]
              for line in [line for line in selected if 'error:' in line][:20]:
                  escaped = line[:2000].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print('::error::' + escaped)
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
                  output.write('## Build and test diagnostics\n\n```text\n')
                  output.write('\n'.join(selected[-100:]) or 'No error lines reported.')
                  output.write('\n```\n')
          PYREPORT
          if [ -d build/Tests.xcresult ]; then
            xcrun xcresulttool get test-results summary --path build/Tests.xcresult >> "$GITHUB_STEP_SUMMARY" || true
          fi
      - name: Archive and package unsigned IPA
        run: scripts/unsigned-ipa.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Bloom-unsigned
          path: build/Bloom-unsigned.ipa
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Test-results
          path: |
            build/Tests.xcresult
            build/NavigationPreflight.xcresult
          if-no-files-found: ignore
  publish-ipa:
    needs: test-and-package
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Bloom-unsigned
          path: build
      - name: Publish downloadable IPA
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          cp build/Bloom-unsigned.ipa build/Bloom.ipa
          cat > build/release-notes.md <<'NOTES'
          Build automatica dopo il completamento dei test e dell'archivio iOS.
          Bloom.ipa non è firmato: importarlo nel servizio di firma prima dell'installazione.
          Archivio privato, cattura manuale e azione Comandi Rapidi: nessun App Group richiesto.
          NOTES
          printf '\nCommit: `%s`\nRun: https://github.com/%s/actions/runs/%s\n' "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> build/release-notes.md
          RELEASE_TAG="build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$RELEASE_TAG" build/Bloom.ipa \
            --target "$GITHUB_SHA" --title "Bloom build ${GITHUB_RUN_NUMBER}" \
            --notes-file build/release-notes.md --draft
          gh release edit "$RELEASE_TAG" --draft=false --latest
