name: iOS technical milestone
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-and-package:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          brew install xcodegen
          xcodegen --version
      - name: Generate Xcode project
        run: |
          xcodegen generate
          git diff --exit-code -- Bloom/Info.plist
      - name: Test persistence and recovery
        shell: bash
        run: |
          set -euo pipefail
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for key,devices in d["devices"].items() if "iOS" in key for x in devices if x["name"].startswith("iPhone")))')
          xcodebuild -project Bloom.xcodeproj -scheme Bloom -destination "platform=iOS Simulator,id=$DEVICE_ID" -resultBundlePath build/Tests.xcresult CODE_SIGNING_ALLOWED=NO test
      - name: Archive and package unsigned IPA
        run: scripts/unsigned-ipa.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Bloom-unsigned
          path: build/Bloom-unsigned.ipa
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Test-results
          path: build/Tests.xcresult
          if-no-files-found: ignore
  publish-ipa:
    needs: test-and-package
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Bloom-unsigned
          path: build
      - name: Publish downloadable IPA
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          cp build/Bloom-unsigned.ipa build/Bloom.ipa
          cat > build/release-notes.md <<'NOTES'
          Build automatica dopo il completamento dei test e dell'archivio iOS.
          Bloom.ipa non è firmato: importarlo nel servizio di firma prima dell'installazione.
          Archivio privato, cattura manuale e azione Comandi Rapidi: nessun App Group richiesto.
          NOTES
          printf '\nCommit: `%s`\nRun: https://github.com/%s/actions/runs/%s\n' "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> build/release-notes.md
          RELEASE_TAG="build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$RELEASE_TAG" build/Bloom.ipa \
            --target "$GITHUB_SHA" --title "Bloom build ${GITHUB_RUN_NUMBER}" \
            --notes-file build/release-notes.md --draft
          gh release edit "$RELEASE_TAG" --draft=false --latest
