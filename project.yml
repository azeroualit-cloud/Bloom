name: Bloom
options:
  bundleIdPrefix: app.bloom
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    BLOOM_BUILD_COMMIT: local
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
targets:
  Bloom:
    type: application
    platform: iOS
    sources: [Bloom, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.bloom.ios
        INFOPLIST_FILE: Bloom/Info.plist
  BloomTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Bloom
schemes:
  Bloom:
    build:
      targets:
        Bloom: all
    test:
      targets: [BloomTests]
