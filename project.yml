name: Bloom
options:
  bundleIdPrefix: app.bloom
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    APP_GROUP_IDENTIFIER: group.app.bloom.shared
    CODE_SIGN_STYLE: Automatic
targets:
  Bloom:
    type: application
    platform: iOS
    sources: [Bloom, Shared]
    info:
      path: Bloom/Info.plist
    entitlements:
      path: Bloom/Bloom.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.bloom.ios
    dependencies:
      - target: BloomShare
        embed: true
  BloomShare:
    type: app-extension
    platform: iOS
    sources: [ShareExtension, Shared]
    info:
      path: ShareExtension/Info.plist
    entitlements:
      path: ShareExtension/BloomShare.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.bloom.ios.share
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  BloomTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Bloom
schemes:
  Bloom:
    build:
      targets:
        Bloom: all
    test:
      targets: [BloomTests]
